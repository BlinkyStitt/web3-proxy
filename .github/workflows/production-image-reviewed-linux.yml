name: Reviewed Linux production image

on:
  workflow_call:

jobs:
  image:
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-build
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Install the pinned GitHub CLI
        shell: bash
        run: |
          bin="$RUNNER_TEMP/github-cli"
          mkdir "$bin"
          archive="$bin/gh.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/cli/cli/releases/download/v2.105.0/gh_2.105.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=2 -C "$bin" gh_2.105.0_linux_amd64/bin/gh
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the validated image from the main push
        if: github.event_name == 'workflow_dispatch' && github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docker/reuse_production_image.py
      - name: Select the Debian snapshot for this source revision
        if: steps.reuse.outputs.digest == ''
        id: apt
        env:
          GH_TOKEN: ${{ github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: python3 -m docker.select_apt_snapshot
      - name: Check APT and image reuse helpers
        if: steps.reuse.outputs.digest == ''
        run: python3 -m unittest discover -s docker/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # The GHA layer exporter does not include RUN cache mounts. Restore Cargo's
      # dependency and compiler caches separately; Cargo still checks fingerprints.
      - name: Restore Cargo build caches
        if: steps.reuse.outputs.digest == ''
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-cache
          key: cargo-production-amd64-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'docker/production.Dockerfile', 'docker/cargo-cache.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-production-amd64-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'docker/production.Dockerfile', 'docker/cargo-cache.Dockerfile') }}-
      - name: Restore Cargo cache mounts
        if: steps.reuse.outputs.digest == '' && steps.cargo-cache.outputs.cache-hit != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          # Change the RUN key without pruning the mounted Cargo cache.
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            --build-arg "CACHE_TRANSFER_NONCE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-restore" \
            --progress plain --file docker/cargo-cache.Dockerfile --target restore --output type=cacheonly "$RUNNER_TEMP/cargo-cache"
      - name: Registry login
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate, build, and publish
        if: steps.reuse.outputs.digest == ''
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/production.Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'SatoshiAndKin/web3-proxy' }}
          tags: ghcr.io/satoshiandkin/web3-proxy:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            DEBIAN_ARCHIVE_SNAPSHOT=${{ steps.apt.outputs.archive }}
            DEBIAN_SECURITY_SNAPSHOT=${{ steps.apt.outputs.security }}
            CARGO_CACHE_SEED=${{ steps.cargo-cache.outputs.cache-hit == '' && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
          cache-from: type=gha,scope=production-amd64
          # Keep optional layer exports on branch builds. Main can deploy
          # as soon as its tested image and durable build record are ready.
          cache-to: ${{ github.ref != 'refs/heads/main' && 'type=gha,scope=production-amd64,mode=max,ignore-error=true' || '' }}
          provenance: true
          sbom: true
      - name: Export Cargo cache mounts
        if: steps.reuse.outputs.digest == '' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cargo-cache-empty"
          # Export two archive files directly; do not load an intermediate image
          # into Docker or copy millions of cache files through a container.
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            --build-arg "CACHE_TRANSFER_NONCE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-export" \
            --progress plain --file docker/cargo-cache.Dockerfile --target export --output "type=local,dest=$RUNNER_TEMP/cargo-cache-export" \
            "$RUNNER_TEMP/cargo-cache-empty"
          (cd "$RUNNER_TEMP/cargo-cache-export" && sha256sum --check SHA256SUMS)
          rm -rf "$RUNNER_TEMP/cargo-cache"
          mv "$RUNNER_TEMP/cargo-cache-export" "$RUNNER_TEMP/cargo-cache"
      - name: Publish latest for the successful current-main build
        if: github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.reuse.outputs.digest || steps.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote https://github.com/SatoshiAndKin/web3-proxy.git refs/heads/main | cut -f1)
          if [ "$current" = "$COMMIT" ]; then
            docker buildx imagetools create --tag ghcr.io/satoshiandkin/web3-proxy:latest \
              "ghcr.io/satoshiandkin/web3-proxy@$IMAGE_DIGEST"
          fi
      - name: Record immutable deployment reference
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        env:
          IMAGE_DIGEST: ${{ steps.reuse.outputs.digest || steps.image.outputs.digest }}
        run: printf 'Deploy ghcr.io/satoshiandkin/web3-proxy@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the branch build's exact Debian imports
        if: github.event_name == 'push' && github.repository == 'SatoshiAndKin/web3-proxy' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-apt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debian-apt.json
          if-no-files-found: error

      - name: Save the exact validated manifest
        if: github.event_name == 'push' && github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/production-image.txt"
      - name: Retain the production build record
        if: github.event_name == 'push' && github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-image.txt
          if-no-files-found: error
