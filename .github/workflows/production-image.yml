name: Production image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    uses: SatoshiAndKin/web3-proxy/.github/workflows/production-image-reviewed-linux.yml@24f56e0a302230d12fbe818224cec676ae0e71b0

  deploy:
    needs: image
    if: github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
    uses: SatoshiAndKin/web3-proxy/.github/workflows/production-deploy-reviewed-linux.yml@bee8e9c338e02794aedc09cb5adf187a207f802a
    secrets:
      webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
